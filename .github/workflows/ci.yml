name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Typecheck API
        run: npm run typecheck:server

      - name: Build frontend
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 14
          if-no-files-found: error

  api-smoke:
    name: API smoke test
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start API and check health
        env:
          JWT_SECRET: ci-smoke-test-secret
          PORT: 3001
          DATABASE_PATH: ./data/ci-smoke.db
        run: |
          npm run start:api &
          echo "Waiting for API..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/api/health; then
              echo "Health check passed"
              exit 0
            fi
            sleep 1
          done
          echo "API did not become healthy in time"
          exit 1
