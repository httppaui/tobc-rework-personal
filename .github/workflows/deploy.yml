name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci-not-success:
    name: Skip deploy (CI not green)
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion != 'success'
    runs-on: ubuntu-latest
    steps:
      - run: echo "CI did not succeed; deploy skipped."

  deploy:
    name: Deploy production
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Detect deploy targets
        id: targets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "vercel=true" >> "$GITHUB_OUTPUT"
          else
            echo "vercel=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "render=true" >> "$GITHUB_OUTPUT"
          else
            echo "render=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build frontend (production API URL)
        if: steps.targets.outputs.vercel == 'true'
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Deploy frontend to Vercel
        if: steps.targets.outputs.vercel == 'true'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./

      - name: Deploy API on Render
        if: steps.targets.outputs.render == 'true'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl -fsSL -X POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Deploy skipped notice
        if: >-
          steps.targets.outputs.vercel != 'true' &&
          steps.targets.outputs.render != 'true'
        run: |
          echo "::notice::No deploy secrets configured. Add VERCEL_* or RENDER_DEPLOY_HOOK_URL to enable CD. See docs/CI-CD.md"
