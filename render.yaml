# Render Blueprint — TOBC API
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: tobc-api
    runtime: node
    buildCommand: npm install
    startCommand: npm run start:api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false
      - key: COOKIE_SAME_SITE
        value: none
      - key: DATABASE_PATH
        value: /data/tobc.db
    disk:
      name: tobc-data
      mountPath: /data
      sizeGB: 1
